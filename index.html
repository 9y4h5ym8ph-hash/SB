<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    </head>
    <body>
        <div id="score-app">
             <h1>Score</h1>
        <div class="container">
            <div class="boxes">
                <h3>HOME</h3>
                <div id="h-nb" class="nb-box">0</div>
                <div class="bttn-row">
                    <button class="bttns" onclick="oneH()">+1</button>
                    <button class="bttns" onclick="twoH()">+2</button>
                    <button class="bttns" onclick="threeH()">+3</button>
                </div>
            </div>
            <div class="boxes">
                <h3>GUEST</h3>
                <div id="g-nb" class="nb-box">0</div>
                <div class="bttn-row">
                    <button id="one-g" class="bttns" onclick="oneG()">+1</button>
                    <button id="two-g" class="bttns" onclick="twoG()">+2</button>
                    <button id="three-g" class="bttns" onclick="threeG()">+3</button>
                </div>
            </div>
        </div>
        <button id="reset" onclick="reset()">Reset</button>
        </div>
        <script src="index.js"></script>
    </body>
</html>
